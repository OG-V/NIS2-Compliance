      <span class="tag">Internal</span>
    </div>
    <div class="spacer"></div>
    <div id="engChip"></div>
    <button class="icon-btn" id="homeBtn" title="All engagements"><svg class="i"><use href="#i-home"/></svg></button>
    <button class="icon-btn" id="settingsBtn" title="Settings"><svg class="i"><use href="#i-settings"/></svg></button>
    <div class="loader" id="loader"></div>
  </header>

  <main class="main" id="main"></main>
