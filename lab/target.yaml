# Scan target description for the NordMSP lab. Relative paths resolve against
# this file's directory. ./lab.sh points .current at the active profile.
#
# Each section except documents lists assets. The lab has one of each kind; a real
# estate lists every web endpoint, SSH host and so on, each with a name that the
# report uses. A single mapping instead of a list is also accepted.
name: nordmsp-lab

# The agreed scope of the scan. For a client this records who authorised it and until
# when; scans outside the window are refused. Active tests (such as trying a default
# admin password once) run only if active_tests is true. The lab is our own system.
engagement:
  client: NordMSP AS (fictional lab)
  authorised_by: Lab owner
  authorised_on: 2026-09-01
  valid_until: 2027-12-31
  active_tests: true
env_file: .current/lab.env   # provides KC_ADMIN_PASSWORD

web:
  - name: portal
    host: 127.0.0.1
    http_port: 18080
    https_port: 18443
ssh:
  - name: app-host
    host: 127.0.0.1
    port: 12222
    container: nis2lab-host-1   # optional: without it, only network-visible SSH checks run
idp:
  - name: keycloak
    url: http://127.0.0.1:18081
    # product: keycloak       # optional; left out, the product is detected from the URL
    realm: nordmsp
    admin_user: admin
    admin_password_env: KC_ADMIN_PASSWORD
logs:
  - name: loki
    url: http://127.0.0.1:13100
  - name: elasticsearch
    url: http://127.0.0.1:19200
    username: nis2scan          # a read-only user created for the scanner
    password_env: ES_SCAN_PASSWORD
backup:
  - name: restic
    container: nis2lab-backup-1    # the tool runs inside it, configured with its repository
  - name: borg
    container: nis2lab-backup-borg-1
docker:
  - name: nis2lab
    compose_project: nis2lab
documents:
  dir: .current/org
  ir_plan: incident-response.md
  asset_inventory: assets.yaml
  risk_exceptions: risk-exceptions.yaml   # optional
  evidence_register: evidence-register.yaml   # document reviews by a named reviewer (ADR 0007)
