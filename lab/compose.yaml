# Demo target for nis2scan: a fictional small managed service provider ("NordMSP").
# The weak profile is deliberately insecure. Every port binds to 127.0.0.1 only;
# do not change that. Start via ./lab.sh, which selects profiles/<name>/lab.env.
name: nis2lab

services:
  certgen:
    build: ./certgen
    command: ["/bin/sh", "/scripts/certgen.sh"]
    environment:
      CERT_MODE: ${CERT_MODE:-valid}
    volumes:
      - ./scripts:/scripts:ro
      - certs:/certs

  web:
    image: ${WEB_IMAGE:-nginx:1.29-alpine}
    depends_on:
      certgen:
        condition: service_completed_successfully
    volumes:
      - ./profiles/${LAB_PROFILE:-hardened}/nginx.conf:/etc/nginx/nginx.conf:ro
      - certs:/certs:ro
    ports:
      - "127.0.0.1:18080:80"
      - "127.0.0.1:18443:443"

  host:
    build: ./host
    volumes:
      - ./profiles/${LAB_PROFILE:-hardened}/sshd_config:/etc/ssh/sshd_config:ro
    ports:
      - "127.0.0.1:12222:22"

  idp:
    image: ${IDP_IMAGE:-quay.io/keycloak/keycloak:26.7.4}
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?set in lab.env}
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./profiles/${LAB_PROFILE:-hardened}/realm-nordmsp.json:/opt/keycloak/data/import/realm-nordmsp.json:ro
    ports:
      - "127.0.0.1:18081:8080"
    healthcheck:
      # The Keycloak image ships without curl, so use bash's /dev/tcp.
      test:
        - CMD-SHELL
        - >-
          exec 3<>/dev/tcp/127.0.0.1/9000 &&
          printf 'GET /health/ready HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 &&
          grep -q UP <&3
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s

  logs:
    image: ${LOGS_IMAGE:-grafana/loki:3.7.8}
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes:
      - ./profiles/${LAB_PROFILE:-hardened}/loki.yaml:/etc/loki/loki.yaml:ro
    ports:
      - "127.0.0.1:13100:3100"

  # A second log store, of another product: Elasticsearch with security on.
  search:
    image: ${SEARCH_IMAGE:-elasticsearch:9.5.3}
    environment:
      discovery.type: single-node
      ES_JAVA_OPTS: -Xms512m -Xmx512m
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set in lab.env}
    ports:
      - "127.0.0.1:19200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS -u elastic:$$ELASTIC_PASSWORD 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' >/dev/null"]
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 30s

  # One-shot configuration, run by lab.sh after `up --wait` (which treats a container
  # that exits as a failure unless another service depends on it).
  search-setup:
    image: curlimages/curl:8.22.0
    profiles: [setup]
    depends_on:
      search:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/scripts/search-setup.sh"]
    environment:
      ELASTIC_PASSWORD: ${ELASTIC_PASSWORD:?set in lab.env}
      ES_SCAN_PASSWORD: ${ES_SCAN_PASSWORD:?set in lab.env}
      LAB_PROFILE: ${LAB_PROFILE:-hardened}
    volumes:
      - ./scripts:/scripts:ro

  backup:
    build:
      context: ./backup
      args:
        BASE_IMAGE: ${BACKUP_BASE_IMAGE:-restic/restic:0.19.1}
        APPLY_OS_UPDATES: ${BACKUP_OS_UPDATES:-true}
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      RESTIC_REPOSITORY: /repo
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?set in lab.env}
      BACKUP_TIME: ${BACKUP_TIME:-}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./profiles/${LAB_PROFILE:-hardened}/org:/data/org:ro
      - backup-repo:/repo

  # A second backup tool: BorgBackup, with its own repository.
  backup-borg:
    build:
      context: ./backup-borg
    entrypoint: ["/bin/sh", "/scripts/borg-backup.sh"]
    environment:
      BORG_REPO: /repo
      BORG_PASSPHRASE: ${BORG_PASSPHRASE:-}
      BORG_ENCRYPTION: ${BORG_ENCRYPTION:?set in lab.env}
      BORG_UNKNOWN_UNENCRYPTED_REPO_ACCESS_IS_OK: "yes"
      BORG_TIME: ${BORG_TIME:-}
      BORG_INTERVAL: ${BORG_INTERVAL:-}
    volumes:
      - ./scripts:/scripts:ro
      - ./profiles/${LAB_PROFILE:-hardened}/org:/data/org:ro
      - borg-repo:/repo

  # A forgotten service that is not in the asset inventory (weak profile only).
  legacy-web:
    image: busybox:1.37
    profiles: [weak]
    command: ["httpd", "-f", "-p", "8000", "-h", "/tmp"]

volumes:
  certs:
  backup-repo:
  borg-repo:
