name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e '.[dev,llm]'
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Catalog integrity
        run: |
          nis2scan validate-catalog
          nis2scan verify-quotes
      # Uses recorded lab evidence and a fake LLM client: no Docker, no API key.
      - name: Tests
        run: pytest -q
