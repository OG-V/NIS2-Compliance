id: REQ-CIR2690-6.6.2-02
title: Document reasons for not patching
obligation: The entity shall duly document and substantiate the reasons for any decision not to apply
  security patches.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.2
  nis2_article: 21(2)(e)
  quote: The relevant entities shall duly document and substantiate the reasons for any such decision.
testability: documentary
evidence:
- documented patch exception decisions
- substantiating justification records
- patch management policy and registers
