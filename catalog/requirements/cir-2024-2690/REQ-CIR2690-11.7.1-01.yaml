id: REQ-CIR2690-11.7.1-01
title: Multi-factor or continuous authentication for access
obligation: The entity shall ensure that users are authenticated by multiple authentication factors or
  continuous authentication mechanisms for accessing its network and information systems, where appropriate,
  in accordance with the classification of the asset to be accessed.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.7.1
  nis2_article: 21(2)(i), (j)
  quote: The relevant entities shall ensure that users are authenticated by multiple authentication factors
    or continuous authentication mechanisms for accessing the relevant entities’ network and information
    systems, where appropriate, in accordance with the classification of the asset to be accessed.
testability: technical
evidence:
- authentication system configuration
- MFA enrolment and enforcement policy records
- asset classification scheme
- list of systems with MFA or continuous authentication enabled
- authentication logs showing factor usage
parameters:
  authentication_mechanism_type: multiple authentication factors or continuous authentication mechanisms
  applicability_condition: where appropriate, in accordance with the classification of the asset to be
    accessed
  number_of_authentication_factors: entity_defined
  asset_classification_levels_requiring_mfa: entity_defined
