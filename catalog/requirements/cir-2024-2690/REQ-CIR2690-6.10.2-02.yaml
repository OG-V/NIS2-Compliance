id: REQ-CIR2690-6.10.2-02
title: Vulnerability scans at planned intervals
obligation: The entity shall perform, where appropriate, vulnerability scans at planned intervals and
  record evidence of the results of the scans.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.10.2
  nis2_article: 21(2)(e)
  quote: perform, where appropriate, vulnerability scans, and record evidence of the results of the scans,
    at planned intervals
testability: technical
evidence:
- vulnerability scanning tool configuration and schedule
- vulnerability scan reports
- records of scan results retained
- assessment determining where scanning is appropriate
parameters:
  scan_intervals: planned intervals
  appropriateness_condition: where appropriate
  scan_scope: entity_defined
