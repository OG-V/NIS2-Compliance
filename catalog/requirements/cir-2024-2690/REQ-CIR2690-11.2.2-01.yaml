id: REQ-CIR2690-11.2.2-01
title: Assign and revoke access rights on principles
obligation: The entity shall assign and revoke access rights based on the principles of need-to-know,
  least privilege and separation of duties.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.2.2
  nis2_article: 21(2)(i), (j)
  quote: assign and revoke access rights based on the principles of need-to-know, least privilege and
    separation of duties
testability: technical
evidence:
- access control policy
- role and permission matrix
- user account provisioning and deprovisioning records
- access rights review reports
parameters:
  assignment_principles: need-to-know, least privilege and separation of duties
