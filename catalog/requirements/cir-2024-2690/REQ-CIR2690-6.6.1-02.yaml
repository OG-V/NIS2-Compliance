id: REQ-CIR2690-6.6.1-02
title: Apply patches within reasonable time
obligation: The entity shall ensure that security patches are applied within a reasonable time after they
  become available.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.1
  nis2_article: 21(2)(e)
  quote: security patches are applied within a reasonable time after they become available;
testability: technical
evidence:
- patch deployment records
- patch management tool reports
- system patch level inventory
- release date versus deployment date logs
parameters:
  patch_application_timeframe: a reasonable time
