id: REQ-CIR2690-4.2.2-05
title: Access controls to backup copies
obligation: The entity shall include in its backup plans appropriate physical and logical access controls
  to backup copies, in accordance with the asset classification level.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: (d) appropriate physical and logical access controls to backup copies, in accordance with the
    asset classification level;
testability: technical
evidence:
- backup plan access control provisions
- access control lists for backup systems
- physical access logs to backup storage
- asset classification records
parameters:
  access_control_types: physical and logical
  access_control_level: entity_defined
  asset_classification_level: entity_defined
