id: REQ-CIR2690-11.3.2-02
title: Dedicated system administration accounts
obligation: The entity shall ensure that the policies referred to in point 11.3.1 set up specific accounts
  to be used for system administration operations exclusively, such as installation, configuration, management
  or maintenance.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.3.2
  nis2_article: 21(2)(i), (j)
  quote: set up specific accounts to be used for system administration operations exclusively, such as
    installation, configuration, management or maintenance;
testability: technical
evidence:
- account inventory or directory listing of administration accounts
- access control policy
- account provisioning records
parameters:
  system_administration_operations: installation, configuration, management or maintenance
