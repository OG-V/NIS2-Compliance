id: REQ-CIR2690-12.4.1-01
title: Maintain complete asset inventory
obligation: The entity shall develop and maintain a complete, accurate, up-to-date and consistent inventory
  of its assets.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 12.4.1
  nis2_article: 21(2)(i)
  quote: The relevant entities shall develop and maintain a complete, accurate, up-to-date and consistent
    inventory of their assets.
testability: documentary
evidence:
- asset inventory register
- asset inventory management procedure
- inventory review or reconciliation records
- asset management tooling export
parameters:
  inventory_scope: their assets
  inventory_quality_criteria: complete, accurate, up-to-date and consistent
  inventory_update_frequency: entity_defined
