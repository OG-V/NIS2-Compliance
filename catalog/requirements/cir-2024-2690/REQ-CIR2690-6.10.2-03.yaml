id: REQ-CIR2690-6.10.2-03
title: Address critical vulnerabilities without undue delay
obligation: The entity shall address, without undue delay, vulnerabilities identified by it as critical
  to its operations.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.10.2
  nis2_article: 21(2)(e)
  quote: address, without undue delay, vulnerabilities identified by the relevant entities as critical
    to their operations
testability: organisational
evidence:
- vulnerability register with criticality classification
- remediation tickets and closure timestamps
- patch or mitigation deployment records
- criteria for determining criticality to operations
parameters:
  remediation_timeframe: without undue delay
  criticality_criteria: entity_defined
