id: REQ-CIR2690-7.3-01
title: Review policy and procedures at planned intervals
obligation: The entity shall review the policy and procedures at planned intervals and when significant
  incidents or significant changes to operations or risks occur.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 7.3
  nis2_article: 21(2)(f)
  quote: The relevant entities shall review and, where appropriate, update the policy and procedures at
    planned intervals and when significant incidents or significant changes to operations or risks.
testability: documentary
evidence:
- policy and procedures for assessing effectiveness of cybersecurity risk-management measures with review
  history
- review records or minutes
- change and incident registers triggering review
parameters:
  review_interval: planned intervals
  review_trigger_events: significant incidents or significant changes to operations or risks
