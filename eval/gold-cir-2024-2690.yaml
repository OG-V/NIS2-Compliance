# Gold set for evaluating requirement extraction from the CIR (EU) 2024/2690 Annex.
#
# For each provision:
#   testability  labels a reviewer would accept for requirements from this provision
#   count        inclusive range of how many requirements a reasonable extraction yields
#   obligations  what must be captured; an obligation counts as found when ALL its
#                keywords appear (case-insensitive) in the obligation or quote of one
#                accepted requirement. Keywords are taken from the legal text, so a
#                verbatim quote covering the obligation always matches.
#
# The provisions were chosen to cover the lab's check areas (logging, backups,
# patching, vulnerabilities, cryptography, access control, MFA, asset inventory)
# and the classic traps: explicit values that must be kept ("at least annually")
# and open values that must not be invented ("predefined number", "reasonable time").
#
# Labels were drafted by Claude and verified by a human (OG V, 2026-09-25) against
# the Annex text, since an LLM-drafted gold set evaluating an LLM would be circular.
labelled_by: Claude (draft), verified by OG V
status: reviewed

provisions:
  "1.1.2":
    testability: [documentary, organisational]
    count: [1, 2]
    obligations:
      - keywords: [reviewed, at least annually]
      - keywords: [result of the reviews, documented]
