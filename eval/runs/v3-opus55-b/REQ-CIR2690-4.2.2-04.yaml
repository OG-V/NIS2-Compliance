id: REQ-CIR2690-4.2.2-04
title: Store backups in separate, distant locations
obligation: The entity shall include in its backup plans storing backup copies (online or offline) in
  a safe location or locations which are not in the same network as the system and are at sufficient distance
  to escape any damage from a disaster at the main site.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: storing backup copies (online or offline) in a safe location or locations, which are not in the
    same network as the system, and are at sufficient distance to escape any damage from a disaster at
    the main site
testability: technical
evidence:
- backup storage location inventory
- network diagrams showing backup segregation
- site distance assessment
- offsite or offline storage records
parameters:
  backup_storage_distance: entity_defined
  backup_storage_mode: online or offline
