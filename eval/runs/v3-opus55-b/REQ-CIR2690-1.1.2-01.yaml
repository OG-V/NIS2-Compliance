id: REQ-CIR2690-1.1.2-01
title: Review and update security policy
obligation: The entity shall ensure that the network and information system security policy is reviewed
  and, where appropriate, updated by management bodies at least annually and when significant incidents
  or significant changes to operations or risks occur.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 1.1.2
  nis2_article: 21(2)(a)
  quote: The network and information system security policy shall be reviewed and, where appropriate,
    updated by management bodies at least annually and when significant incidents or significant changes
    to operations or risks occur.
testability: organisational
evidence:
- management body meeting minutes showing policy review
- policy version history with review and approval dates
- records linking policy reviews to significant incidents or changes
parameters:
  review_frequency: at least annually
  review_triggers: when significant incidents or significant changes to operations or risks occur
