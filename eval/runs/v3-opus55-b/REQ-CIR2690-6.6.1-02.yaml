id: REQ-CIR2690-6.6.1-02
title: Apply security patches within reasonable time
obligation: The entity shall ensure through its procedures that security patches are applied within a
  reasonable time after they become available.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.1
  nis2_article: 21(2)(e)
  quote: security patches are applied within a reasonable time after they become available
testability: technical
evidence:
- patch deployment reports
- patch compliance status from endpoint or configuration management tools
- defined patch application timeframes in the patch procedure
- records comparing patch release dates with installation dates
parameters:
  patch_application_timeframe: entity_defined
