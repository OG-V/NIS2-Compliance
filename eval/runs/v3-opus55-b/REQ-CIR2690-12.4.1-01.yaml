id: REQ-CIR2690-12.4.1-01
title: Maintain complete accurate asset inventory
obligation: The entity shall develop and maintain a complete, accurate, up-to-date and consistent inventory
  of their assets.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 12.4.1
  nis2_article: 21(2)(i)
  quote: The relevant entities shall develop and maintain a complete, accurate, up-to-date and consistent
    inventory of their assets.
testability: documentary
evidence:
- asset inventory or register
- asset management tool export
- inventory reconciliation or review records
- asset discovery scan results compared against inventory
