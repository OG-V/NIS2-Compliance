id: REQ-CIR2690-9.2-01
title: Cryptographic measures based on asset classification
obligation: The entity shall ensure that the policy and procedures referred to in point 9.1 establish,
  in accordance with the entity's classification of assets, the type, strength and quality of the cryptographic
  measures required to protect the entity's assets, including data at rest and data in transit.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 9.2
  nis2_article: 21(2)(h)
  quote: in accordance with the relevant entities’ classification of assets, the type, strength and quality
    of the cryptographic measures required to protect the relevant entities’ assets, including data at
    rest and data in transit
testability: documentary
evidence:
- approved cryptography policy
- cryptographic procedures document
- asset classification scheme mapped to cryptographic requirements
- documented requirements for encryption of data at rest and in transit
parameters:
  cryptographic_measure_type_strength_quality_per_classification: entity_defined
