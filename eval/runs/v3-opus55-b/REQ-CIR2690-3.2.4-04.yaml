id: REQ-CIR2690-3.2.4-04
title: Timely qualified response to alarms
obligation: The entity shall ensure that, in case of an alarm, a qualified and appropriate response is
  initiated in a timely manner.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.4
  nis2_article: 21(2)(b)
  quote: The relevant entities shall ensure that, in case of an alarm, a qualified and appropriate response
    is initiated in a timely manner.
testability: organisational
evidence:
- alarm response procedure
- incident tickets with response timestamps
- on-call and escalation rosters
- staff qualification or training records
parameters:
  alarm_response_time: entity_defined
