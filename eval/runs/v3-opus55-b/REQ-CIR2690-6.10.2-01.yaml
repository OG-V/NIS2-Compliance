id: REQ-CIR2690-6.10.2-01
title: Monitor vulnerability information through appropriate channels
obligation: The entity shall, for the purpose of point 6.10.1, monitor information about vulnerabilities
  through appropriate channels, such as announcements of CSIRTs, competent authorities or information
  provided by suppliers or service providers.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.10.2
  nis2_article: 21(2)(e)
  quote: monitor information about vulnerabilities through appropriate channels, such as announcements
    of CSIRTs, competent authorities or information provided by suppliers or service providers
testability: organisational
evidence:
- list of subscribed vulnerability information sources
- records of received vulnerability advisories
- vulnerability monitoring procedure
- interviews with security staff responsible for monitoring
parameters:
  monitoring_channels: entity_defined
