id: REQ-CIR2690-9.2-02
title: Approved protocols, algorithms and cryptographic solutions
obligation: The entity shall ensure that the policy and procedures referred to in point 9.1 establish,
  based on point (a), the protocols or families of protocols to be adopted, as well as the cryptographic
  algorithms, cipher strength, cryptographic solutions and usage practices to be approved and required
  for use in the entity, following, where appropriate, a cryptographic agility approach.
