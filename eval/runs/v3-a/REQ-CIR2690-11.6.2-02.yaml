id: REQ-CIR2690-11.6.2-02
title: Controlled allocation of secret authentication information
obligation: The entity shall control the allocation to users and management of secret authentication information
  by a process that ensures the confidentiality of the information, including advising personnel on appropriate
  handling of authentication information.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.6.2
  nis2_article: 21(2)(i), (j)
  quote: control the allocation to users and management of secret authentication information by a process
    that ensures the confidentiality of the information, including advising personnel on appropriate handling
    of authentication information
testability: organisational
evidence:
- credential allocation procedure
- records of credential issuance and distribution
- user awareness material or guidance on handling authentication information
- acknowledgement records from personnel
parameters:
  credential_allocation_process: entity_defined
