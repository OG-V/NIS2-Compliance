id: REQ-CIR2690-3.2.5-02
title: Protect logs from unauthorised access or changes
obligation: The entity shall protect logs from unauthorised access or changes.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.5
  nis2_article: 21(2)(b)
  quote: shall protect them from unauthorised access or changes
testability: technical
evidence:
- access control lists for log repositories
- log integrity protection settings (e.g. write-once or hashing configuration)
- audit trail of log access
- review of user permissions on logging systems
parameters:
  authorised_roles_for_log_access: entity_defined
