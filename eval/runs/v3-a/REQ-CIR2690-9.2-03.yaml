id: REQ-CIR2690-9.2-03
title: Establish key management approach
obligation: The entity shall establish its approach to key management, including, where appropriate, methods
  for generating keys, issuing and obtaining public key certificates, distributing and activating keys,
  storing keys and access to them, changing or updating keys, dealing with compromised keys, revoking
  keys, recovering lost or corrupted keys, backing up or archiving keys, destroying keys, logging and
  auditing key management activities, and setting activation and deactivation dates for keys.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 9.2
  nis2_article: 21(2)(h)
  quote: 'the relevant entities’ approach to key management, including, where appropriate, methods for
    the following:'
testability: documentary
evidence:
- key management policy and procedures
- key generation and distribution records
- certificate management records
- key revocation and destruction records
- key management activity logs and audit records
parameters:
  key_management_methods: entity_defined
  key_change_rules: entity_defined
  key_activation_and_deactivation_dates: entity_defined
  key_validity_period: entity_defined
