id: REQ-CIR2690-3.2.1-02
title: Respond to detected events to mitigate impact
obligation: The entity shall respond accordingly to detected events that could be considered as incidents
  in order to mitigate the impact.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.1
  nis2_article: 21(2)(b)
  quote: The relevant entities shall lay down procedures and use tools to monitor and log activities on
    their network and information systems to detect events that could be considered as incidents and respond
    accordingly to mitigate the impact.
testability: organisational
evidence:
- documented incident response procedures
- records of alerts and follow-up actions taken
- ticketing or case management records for detected events
- interviews with security operations staff
parameters:
  response_actions: entity_defined
  response_time: entity_defined
