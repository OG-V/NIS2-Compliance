id: REQ-CIR2690-6.6.2-01
title: Condition for not applying security patches
obligation: The entity shall only choose not to apply security patches, by way of derogation from point
  6.6.1(a), when the disadvantages of applying the security patches outweigh the cybersecurity benefits.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.2
  nis2_article: 21(2)(e)
  quote: the relevant entities may choose not to apply security patches when the disadvantages of applying
    the security patches outweigh the cybersecurity benefits
testability: organisational
evidence:
- patch management policy
- risk or impact assessments comparing patch disadvantages and cybersecurity benefits
- records of patch deployment decisions
- change advisory board minutes
parameters:
  criteria_for_weighing_disadvantages_against_benefits: entity_defined
