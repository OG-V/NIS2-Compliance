id: REQ-CIR2690-3.2.3-01
title: Maintain, document and review logs
obligation: The entity shall maintain, document, and review logs based on the procedures referred to in
  point 3.2.1.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.3
  nis2_article: 21(2)(b)
  quote: Based on the procedures referred to in point 3.2.1, the relevant entities shall maintain, document,
