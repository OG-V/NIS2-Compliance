id: REQ-CIR2690-11.3.2-01
title: Strong authentication for privileged accounts
obligation: The entity shall ensure that the policies referred to in point 11.3.1 establish strong identification,
  authentication such as multi-factor authentication, and authorisation procedures for privileged accounts
  and system administration accounts.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.3.2
  nis2_article: 21(2)(i), (j)
  quote: establish strong identification, authentication such as multi-factor authentication, and authorisation
    procedures for privileged accounts and system administration accounts
testability: technical
evidence:
- privileged access management policy
- authentication configuration for privileged accounts
- multi-factor authentication enrolment records
- authorisation approval records for privileged accounts
parameters:
  privileged_account_authentication_method: entity_defined
  authorisation_procedure_for_privileged_accounts: entity_defined
