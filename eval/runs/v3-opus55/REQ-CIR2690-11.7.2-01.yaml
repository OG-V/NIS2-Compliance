id: REQ-CIR2690-11.7.2-01
title: Authentication strength matched to asset classification
obligation: The entity shall ensure that the strength of authentication is appropriate for the classification
  of the asset to be accessed.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.7.2
  nis2_article: 21(2)(i), (j)
  quote: The relevant entities shall ensure that the strength of authentication is appropriate for the
    classification of the asset to be accessed.
testability: technical
evidence:
- authentication policy mapping authentication methods to asset classification levels
- asset inventory with classification
- identity provider or system authentication configuration
- conditional access or MFA enforcement rules
parameters:
  authentication_strength_per_classification: entity_defined
