id: REQ-CIR2690-3.2.1-01
title: Monitoring and logging procedures and tools
obligation: The entity shall lay down procedures and use tools to monitor and log activities on its network
  and information systems to detect events that could be considered as incidents and respond accordingly
  to mitigate the impact.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.1
  nis2_article: 21(2)(b)
  quote: The relevant entities shall lay down procedures and use tools to monitor and log activities on
    their network and information systems to detect events that could be considered as incidents and respond
    accordingly to mitigate the impact.
testability: technical
evidence:
- approved monitoring and logging procedure
- inventory of monitoring and logging tools (e.g. SIEM, log collectors)
- logging configuration of network and information systems
- sample activity logs
- monitoring alerts and event detection records
- records of responses to detected events
parameters:
  monitored_scope: activities on their network and information systems
