id: REQ-CIR2690-6.6.1-02
title: Timely application of security patches
obligation: The entity shall, through its patch management procedures, ensure that security patches are
  applied within a reasonable time after they become available.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.1
  nis2_article: 21(2)(e)
  quote: security patches are applied within a reasonable time after they become available
testability: technical
evidence:
- patch deployment records with release and installation dates
- patch compliance reports from endpoint or configuration management tools
- defined patching timeframes in the procedure
parameters:
  patch_application_timeframe: entity_defined
