id: REQ-CIR2690-9.2-02
title: Approved protocols, algorithms and cryptographic solutions
obligation: The entity shall establish in its cryptography policy and procedures, based on point (a),
  the protocols or families of protocols to be adopted, as well as the cryptographic algorithms, cipher
  strength, cryptographic solutions and usage practices to be approved and required for use in the entity,
  following, where appropriate, a cryptographic agility approach.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 9.2
  nis2_article: 21(2)(h)
  quote: based on point (a), the protocols or families of protocols to be adopted, as well as cryptographic
    algorithms, cipher strength, cryptographic solutions and usage practices to be approved and required
    for use in the relevant entities, following, where appropriate, a cryptographic agility approach
testability: documentary
evidence:
- list of approved protocols and cryptographic algorithms
- cryptographic standard specifying cipher strengths and usage practices
- documentation of cryptographic agility approach
- system configuration showing use of approved protocols and ciphers
