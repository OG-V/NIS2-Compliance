id: REQ-CIR2690-6.6.2-01
title: Document and substantiate patch non-application decisions
obligation: The entity shall duly document and substantiate the reasons for any decision, by way of derogation
  from point 6.6.1(a), not to apply security patches when the disadvantages of applying the security patches
  outweigh the cybersecurity benefits.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.2
  nis2_article: 21(2)(e)
  quote: The relevant entities shall duly document and substantiate the reasons for any such decision.
testability: documentary
evidence:
- records of decisions not to apply security patches
- documented justifications or risk assessments comparing disadvantages of patching with cybersecurity
  benefits
- patch exception register
- approval records for patch exceptions
