id: REQ-CIR2690-3.2.5-02
title: Protect logs from unauthorised access
obligation: The entity shall protect logs from unauthorised access or changes.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.5
  nis2_article: 21(2)(b)
  quote: shall protect them from unauthorised access or changes
testability: technical
evidence:
- access control lists for log storage
- log integrity protection configuration (e.g. write-once storage or integrity checks)
- audit trail of access to log repositories
- documented log protection procedure
