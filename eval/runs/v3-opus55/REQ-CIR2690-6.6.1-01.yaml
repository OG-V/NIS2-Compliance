id: REQ-CIR2690-6.6.1-01
title: Security patch management procedures
obligation: The entity shall specify and apply security patch management procedures, coherent with the
  change management procedures referred to in point 6.4.1 as well as with vulnerability management, risk
  management and other relevant management procedures.
