id: REQ-CIR2690-9.2-03
title: Key management approach and methods
obligation: The entity shall establish in its cryptography policy and procedures its approach to key management,
  including, where appropriate, methods for generating different keys for cryptographic systems and applications;
  issuing and obtaining public key certificates; distributing keys to intended entities, including how
  to activate keys when received; storing keys, including how authorised users obtain access to keys;
  changing or updating keys, including rules on when and how to change keys; dealing with compromised
  keys; revoking keys, including how to withdraw or deactivate keys; recovering lost or corrupted keys;
  backing up or archiving keys; destroying keys; logging and auditing of key management-related activities;
  and setting activation and deactivation dates for keys ensuring that keys can only be used for the specified
  period of time according to the organization's rules on key management.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 9.2
  nis2_article: 21(2)(h)
  quote: 'the relevant entities’ approach to key management, including, where appropriate, methods for
    the following:'
testability: documentary
evidence:
- approved key management procedure
- key lifecycle documentation covering generation, distribution, storage, rotation, revocation, recovery,
  backup and destruction
- certificate management procedure
- key management activity logs and audit records
- key inventory with activation and deactivation dates
parameters:
  key_change_rules: entity_defined
  key_validity_period: entity_defined
