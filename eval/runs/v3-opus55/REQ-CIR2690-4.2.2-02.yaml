id: REQ-CIR2690-4.2.2-02
title: Assurance of complete and accurate backups
obligation: The entity shall, based on the results of the risk assessment carried out pursuant to point
  2.1 and the business continuity plan, lay down backup plans which include assurance that backup copies
  are complete and accurate, including configuration data and data stored in cloud computing service environment.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: (b) assurance that backup copies are complete and accurate, including configuration data and
    data stored in cloud computing service environment;
testability: technical
evidence:
- approved backup plan
- backup job configuration and scope
- backup integrity verification logs
- records of backups of configuration data and cloud-stored data
