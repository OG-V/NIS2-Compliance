id: REQ-CIR2690-4.2.1-02
title: Provide resources for appropriate redundancy
obligation: The entity shall provide sufficient available resources, including facilities, network and
  information systems and staff, to ensure an appropriate level of redundancy.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.1
  nis2_article: 21(2)(c)
  quote: provide sufficient available resources, including facilities, network and information systems
    and staff, to ensure an appropriate level of redundancy
testability: organisational
evidence:
- redundancy architecture documentation
- inventory of redundant facilities and systems
- failover configuration
- staffing and backup personnel plans
- business continuity plan
parameters:
  redundancy_level: entity_defined
  resource_sufficiency: entity_defined
