id: REQ-CIR2690-4.2.2-03
title: Safe, separated, distant backup storage
obligation: The entity shall, based on the results of the risk assessment carried out pursuant to point
  2.1 and the business continuity plan, lay down backup plans which include storing backup copies (online
  or offline) in a safe location or locations which are not in the same network as the system and are
  at sufficient distance to escape any damage from a disaster at the main site.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: (c) storing backup copies (online or offline) in a safe location or locations, which are not
    in the same network as the system, and are at sufficient distance to escape any damage from a disaster
    at the main site;
testability: technical
evidence:
- approved backup plan
- backup storage location records
- network diagrams showing backup segregation
- site distance assessment
parameters:
  backup_storage_mode: online or offline
  backup_site_distance: entity_defined
