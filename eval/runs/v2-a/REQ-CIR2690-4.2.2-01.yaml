id: REQ-CIR2690-4.2.2-01
title: Establish backup plans
obligation: The entity shall lay down backup plans based on the results of the risk assessment carried
  out pursuant to point 2.1 and the business continuity plan.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: 'Based on the results of the risk assessment carried out pursuant to point 2.1 and the business
    continuity plan, the relevant entities shall lay down backup plans which include the following:'
testability: documentary
evidence:
- approved backup plan
- risk assessment results
- business continuity plan
- records linking backup plan to risk assessment outcomes
parameters:
  backup_plan_review_or_update_trigger: entity_defined
