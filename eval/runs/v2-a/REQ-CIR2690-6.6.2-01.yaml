id: REQ-CIR2690-6.6.2-01
title: Derogation limited to unfavourable patch trade-off
obligation: The entity shall only choose not to apply security patches where the disadvantages of applying
  the security patches outweigh the cybersecurity benefits.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.2
  nis2_article: 21(2)(e)
  quote: the relevant entities may choose not to apply security patches when the disadvantages of applying
    the security patches outweigh the cybersecurity benefits
testability: organisational
evidence:
- patch management records
- risk assessments comparing patch disadvantages and cybersecurity benefits
- records of patch exception decisions
- interviews with patch management staff
parameters:
