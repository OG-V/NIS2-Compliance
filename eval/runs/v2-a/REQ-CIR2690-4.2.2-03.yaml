id: REQ-CIR2690-4.2.2-03
title: Completeness and accuracy of backups
obligation: The entity shall include in its backup plans assurance that backup copies are complete and
  accurate, including configuration data and data stored in cloud computing service environment.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: (b) assurance that backup copies are complete and accurate, including configuration data and
    data stored in cloud computing service environment;
testability: technical
evidence:
- backup job logs and integrity/verification reports
- backup plan provisions on completeness and accuracy
- cloud backup configuration settings
parameters:
  backup_verification_frequency: entity_defined
  backup_scope: configuration data and data stored in cloud computing service environment
