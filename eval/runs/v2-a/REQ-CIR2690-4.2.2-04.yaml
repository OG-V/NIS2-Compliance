id: REQ-CIR2690-4.2.2-04
title: Safe offsite storage of backups
obligation: The entity shall include in its backup plans the storing of backup copies (online or offline)
  in a safe location or locations which are not in the same network as the system and are at sufficient
  distance to escape any damage from a disaster at the main site.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 4.2.2
  nis2_article: 21(2)(c)
  quote: (c) storing backup copies (online or offline) in a safe location or locations, which are not
    in the same network as the system, and are at sufficient distance to escape any damage from a disaster
    at the main site;
testability: technical
evidence:
- network segmentation diagrams showing backup storage isolation
- backup storage site documentation and location records
- backup plan provisions on storage locations
parameters:
  backup_storage_distance: entity_defined
  backup_storage_mode: online or offline
