id: REQ-CIR2690-7.3-01
title: Periodic and event-driven review of policy
obligation: The entity shall review and, where appropriate, update the policy and procedures to assess
  the effectiveness of cybersecurity risk-management measures at planned intervals and when significant
  incidents or significant changes to operations or risks occur.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 7.3
  nis2_article: 21(2)(f)
  quote: The relevant entities shall review and, where appropriate, update the policy and procedures at
    planned intervals and when significant incidents or significant changes to operations or risks.
testability: documentary
evidence:
- current version of the policy and procedures for assessing effectiveness of cybersecurity risk-management
  measures
- document version history and change log
- review records, minutes or sign-off approvals
- records linking reviews to significant incidents or significant changes to operations or risks
parameters:
  review_interval: entity_defined
  review_trigger_events: significant incidents or significant changes to operations or risks
  update_condition: where appropriate
