id: REQ-CIR2690-9.2-02
title: Approve protocols, algorithms and usage practices
obligation: The entity shall establish, based on point (a), the protocols or families of protocols to
  be adopted, as well as cryptographic algorithms, cipher strength, cryptographic solutions and usage
  practices to be approved and required for use in the entity, following, where appropriate, a cryptographic
  agility approach.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 9.2
  nis2_article: 21(2)(h)
  quote: based on point (a), the protocols or families of protocols to be adopted, as well as cryptographic
    algorithms, cipher strength, cryptographic solutions and usage practices to be approved and required
    for use in the relevant entities, following, where appropriate, a cryptographic agility approach
testability: documentary
evidence:
- list of approved protocols and cryptographic algorithms
- cipher strength standards
- approved cryptographic solutions inventory
- system cryptographic configuration settings
- documentation of cryptographic agility approach
parameters:
