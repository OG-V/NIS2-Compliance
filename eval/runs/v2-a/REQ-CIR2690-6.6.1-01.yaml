id: REQ-CIR2690-6.6.1-01
title: Establish coherent security patch procedures
obligation: The entity shall specify and apply security patch management procedures that are coherent
  with the change management procedures referred to in point 6.4.1 as well as with vulnerability management,
  risk management and other relevant management procedures.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.1
  nis2_article: 21(2)(e)
  quote: The relevant entities shall specify and apply procedures, coherent with the change management
    procedures referred to in point 6.4.1 as well as with vulnerability management, risk management and
    other relevant management procedures
testability: documentary
evidence:
- approved security patch management procedure
- change management procedure documentation
- vulnerability management and risk management procedures
- records of procedure application
