id: REQ-CIR2690-11.3.2-04
title: Admin accounts limited to admin systems
obligation: The entity shall ensure that the policies referred to in point 11.3.1 provide that system
  administration accounts are only used to connect to system administration systems.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.3.2
  nis2_article: 21(2)(i), (j)
  quote: provide that system administration accounts are only used to connect to system administration
    systems.
testability: technical
evidence:
