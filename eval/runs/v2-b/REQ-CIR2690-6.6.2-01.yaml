id: REQ-CIR2690-6.6.2-01
title: Patch exception only when disadvantages outweigh benefits
obligation: The entity shall, by way of derogation from point 6.6.1(a), only choose not to apply security
  patches when the disadvantages of applying the security patches outweigh the cybersecurity benefits.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 6.6.2
  nis2_article: 21(2)(e)
  quote: the relevant entities may choose not to apply security patches when the disadvantages of applying
    the security patches outweigh the cybersecurity benefits
testability: organisational
evidence:
- patch exception register
- risk assessment or impact analysis supporting the exception decision
- patch management procedure describing exception criteria
- approval records for patch exceptions
parameters:
  patch_exception_criterion: when the disadvantages of applying the security patches outweigh the cybersecurity
    benefits
