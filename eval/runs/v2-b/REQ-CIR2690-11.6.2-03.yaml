id: REQ-CIR2690-11.6.2-03
title: Credential change requirements
obligation: The entity shall require the change of authentication credentials initially, at predefined
  intervals and upon suspicion that the credentials were compromised.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.6.2
  nis2_article: 21(2)(i), (j)
  quote: require the change of authentication credentials initially, at predefined intervals and upon
    suspicion that the credentials were compromised
testability: technical
evidence:
- password/credential policy settings
- system configuration for credential expiry and first-use change
- records of forced credential changes following suspected compromise
parameters:
  credential_change_interval: entity_defined
  initial_change_required: initially
  change_trigger: upon suspicion that the credentials were compromised
