id: REQ-CIR2690-3.2.1-01
title: Monitoring and logging procedures
obligation: The entity shall lay down procedures to monitor and log activities on its network and information
  systems to detect events that could be considered as incidents.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 3.2.1
  nis2_article: 21(2)(b)
  quote: The relevant entities shall lay down procedures and use tools to monitor and log activities on
    their network and information systems to detect events that could be considered as incidents
testability: documentary
evidence:
- approved monitoring and logging procedure
- logging policy
- procedure review and approval records
parameters:
