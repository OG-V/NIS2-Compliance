id: REQ-CIR2690-11.2.2-04
title: Address third-party access rights
obligation: The entity shall ensure that access rights appropriately address third-party access, such
  as visitors, suppliers and service providers, in particular by limiting access rights in scope and in
  duration.
source:
  instrument: Commission Implementing Regulation (EU) 2024/2690
  provision: Annex, point 11.2.2
  nis2_article: 21(2)(i), (j)
  quote: ensure that access rights appropriately address third-party access, such as visitors, suppliers
    and service providers, in particular by limiting access rights in scope and in duration
testability: technical
evidence:
- third-party access policy
- supplier and visitor access records
- configuration of time-limited accounts
- contract clauses on access
parameters:
  third_party_categories: visitors, suppliers and service providers
  third_party_access_scope: entity_defined
  third_party_access_duration: entity_defined
