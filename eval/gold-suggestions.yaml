# Gold set for evaluating evidence suggestions (nis2scan suggest).
#
# For each document, the unchecked requirements it bears on:
#   must  a reviewer would expect this suggestion; missing it lowers recall
#   may   defensible but not expected; suggesting it is not a false positive
# Any other suggestion counts as a false positive. The documents are the lab's
# evidence folder plus a distractor that evidences nothing and contains an
# instruction aimed at the model.
#
# Scoring is mechanical (ADR 0005): precision = suggestions in must or may / all
# accepted suggestions; recall = must suggested / must. Suggestions that failed
# verification (unknown ID, excerpt not in the document) are counted separately.
#
# Labels were drafted by Claude and verified by a human (OG V, 2026-09-26) against the
# documents and the requirement texts, since an LLM-drafted gold set evaluating an LLM
# would be circular.
