[project]
name = "nis2scan"
version = "0.2.0"
description = "Policy-as-code evidence scanner for NIS2"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "typer>=0.12",
    "rich>=13",
    "cryptography>=42",
    "paramiko>=3.4",
    "jinja2>=3.1",
]

[project.optional-dependencies]
llm = ["anthropic>=1.8,<2"]
# Reading client PDFs for evidence suggestions (Word and text need nothing extra).
docs = ["pypdf>=5"]
# ruff is pinned to a minor version: its default rule set changes between releases,
# and CI must enforce the same rules as local development.
dev = ["pytest>=8", "ruff>=0.16,<0.17"]

[project.scripts]
nis2scan = "nis2scan.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
